<style>
/* === LINE Green Design System === */
:root {
    --main: #06C755;
    --main-hover: #049A42;
    --main-text: #027A34;
    --main-bg: #E6F9EE;
    --main-border: #B3EDCC;
    --bg: #f5f5f5;
    --surface: #ffffff;
    --text-primary: #1a1a1a;
    --text-secondary: #888888;
    --border: #e0e0e0;
    --radius: 10px;
    --transition: all 0.2s ease;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 1rem;
    min-height: 100vh;
}

/* === Layout === */
.app-container {
    width: 100%;
    max-width: 560px;
    background-color: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* === Header === */
.app-header {
    background-color: var(--main);
    color: white;
    padding: 1.25rem 1.5rem;
    text-align: center;
}

.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 0.15rem;
}

.logo-icon {
    font-size: 1.6rem;
}

.app-title {
    font-size: 1.4rem;
    font-weight: 700;
}

.app-subtitle {
    font-size: 0.8rem;
    opacity: 0.9;
}

/* === Main Content === */
.app-main {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

/* === Settings Panel === */
.settings-panel {
    background-color: var(--main-bg);
    padding: 0.875rem 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--main-border);
}

.settings-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--main-text);
    margin-bottom: 0.4rem;
}

.settings-input {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--main-border);
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.8rem;
    background-color: var(--surface);
    color: var(--text-primary);
    outline: none;
    transition: var(--transition);
}

.settings-input:focus {
    border-color: var(--main);
}

.settings-hint {
    display: block;
    margin-top: 0.3rem;
    font-size: 0.7rem;
    color: var(--text-secondary);
}

/* === Mode Tabs === */
.mode-tabs {
    display: flex;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
}

.mode-tab {
    flex: 1;
    padding: 0.75rem;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    background-color: #f0f0f0;
    color: #999999;
}

.mode-tab.active {
    background-color: var(--main);
    color: white;
}

.mode-tab:not(.active):hover {
    background-color: #e8e8e8;
    color: #666666;
}

/* === Mode Description === */
.mode-description {
    background-color: var(--main-bg);
    border: 1px solid var(--main-border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
}

.mode-desc-icon {
    color: var(--main);
    font-size: 1rem;
    margin-top: 0.15rem;
    flex-shrink: 0;
}

.mode-description p {
    font-size: 0.8rem;
    color: var(--main-text);
    line-height: 1.5;
}

/* === Upload Section === */
.upload-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.drop-zone {
    border: 2px dashed var(--main-border);
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    text-align: center;
    background-color: var(--main-bg);
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.drop-zone:hover,
.drop-zone.dragover {
    border-color: var(--main);
    background-color: #d4f5e0;
}

.upload-icon {
    font-size: 2rem;
    color: var(--main);
    margin-bottom: 0.5rem;
}

.drop-text {
    margin-bottom: 0.6rem;
    color: var(--text-secondary);
    font-size: 0.85rem;
}

.preview-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--surface);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
}

.preview-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.btn-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    background-color: rgba(0,0,0,0.55);
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    font-size: 0.8rem;
    transition: var(--transition);
}

.btn-remove:hover {
    background-color: #e74c3c;
}

/* === Buttons === */
.btn {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
}

.btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn-upload {
    background-color: var(--surface);
    color: var(--main-text);
    border: 1px solid var(--main);
    padding: 0.5rem 1.25rem;
    font-weight: 600;
}

.btn-upload:hover {
    background-color: var(--main-bg);
}

.btn-action-sm {
    background-color: transparent;
    border: 1px solid var(--main-border);
    color: var(--main-text);
    padding: 0.35rem 0.75rem;
    font-size: 0.78rem;
}

.btn-action-sm:hover {
    border-color: var(--main);
    background-color: var(--main-bg);
}

/* === Loading Overlay === */
.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    z-index: 100;
    color: white;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: var(--main);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* === Result Section === */
.result-section {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--main-border);
    border-radius: var(--radius);
    overflow: hidden;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0.875rem;
    background-color: var(--main-bg);
    border-bottom: 1px solid var(--main-border);
}

.result-header h3 {
    font-size: 0.85rem;
    color: var(--main-text);
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.result-actions {
    display: flex;
    gap: 0.35rem;
}

.textarea-container {
    position: relative;
    flex-grow: 1;
    min-height: 200px;
}

textarea {
    width: 100%;
    height: 100%;
    min-height: 200px;
    padding: 1rem;
    border: none;
    resize: none;
    font-family: monospace;
    font-size: 0.85rem;
    line-height: 1.7;
    background-color: var(--surface);
    color: var(--text-primary);
    outline: none;
}

/* === Status Panel === */
.status-panel {
    padding: 1rem;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    background-color: var(--surface);
}

.status-message {
    padding: 1rem;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.6rem;
}

.status-message i {
    font-size: 2.5rem;
}

.status-message.success {
    background-color: var(--main-bg);
    color: var(--main-text);
    border: 1px solid var(--main-border);
}

.status-message.error {
    background-color: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
}

.json-preview {
    margin-top: 0.5rem;
    width: 100%;
    background-color: rgba(0,0,0,0.03);
    padding: 0.75rem;
    border-radius: 6px;
    font-size: 0.75rem;
    text-align: left;
    overflow-x: auto;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-primary);
}

/* === Footer === */
.app-footer {
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--main-border);
    text-align: center;
}

.app-footer p {
    font-size: 0.75rem;
    color: var(--text-secondary);
}

/* === Toast === */
.toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background-color: #333333;
    color: white;
    padding: 0.6rem 1.25rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 200;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

/* === Responsive === */
@media (max-width: 500px) {
    body {
        padding: 0;
    }
    .app-container {
        border-radius: 0;
        border: none;
        min-height: 100vh;
    }
}
</style>
