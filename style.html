<style>
/* === Two-Tone Design: Green + Amber === */
:root {
    /* Green palette */
    --g-main: #2DA84A;
    --g-text: #1A6B32;
    --g-bg: #EEF8F1;
    --g-border: #A8D9B5;
    --g-desc: #2E5A3C; /* CHANGED: コントラスト比改善 #3A6B47→#2E5A3C */

    /* Amber palette */
    --a-main: #E8A020;
    --a-text: #7A4F0A;
    --a-mid: #C07810;
    --a-bg: #FDF4E3;
    --a-border: #F0C878;

    /* Neutral */
    --bg: #f4f4f2;
    --surface: #ffffff;
    --text-primary: #2a2a2a;
    --text-secondary: #8a8a8a;
    --border: #e0e0e0;
    --settings-bg: #F8F8F6;
    --radius: 10px;

    /* CHANGED: セマンティックカラー定義追加 */
    --c-error-bg: #fef2f2;
    --c-error-text: #b91c1c;
    --c-error-border: #fca5a5;
    --c-info-bg: #EEF4FB;
    --c-info-text: #1A4A7A;
    --c-info-border: #93C5FD;
    --c-warn-bg: var(--a-bg);
    --c-warn-text: var(--a-text);
    --c-warn-border: var(--a-border);
    --transition: all 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 1rem;
    min-height: 100vh;
}

/* === Layout === */
.app-container {
    width: 100%;
    max-width: 560px;
    background-color: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* === Header === */
.app-header {
    background-color: var(--g-main);
    color: white;
    padding: 1.1rem 1.25rem;
}

.header-inner {
    display: flex;
    align-items: center;
    gap: 0.85rem;
}

.header-icon-box {
    width: 42px;
    height: 42px;
    background-color: rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
}

.header-text {
    display: flex;
    flex-direction: column;
}

.app-title {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.2;
}

.app-subtitle {
    font-size: 0.75rem;
    opacity: 0.75;
}

/* === Main === */
.app-main {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

/* === Settings === */
.settings-panel {
    background-color: var(--settings-bg);
    padding: 0.8rem 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
}

.settings-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.4rem;
}

.settings-input {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.78rem;
    background-color: var(--surface);
    color: var(--text-primary);
    outline: none;
    transition: var(--transition);
}

.settings-input:focus {
    border-color: var(--g-main);
}

.settings-hint {
    display: block;
    margin-top: 0.3rem;
    font-size: 0.68rem;
    color: #6b6b6b; /* CHANGED: コントラスト改善 var(--text-secondary)→#6b6b6b */
}

/* === Mode Tabs === */
.mode-tabs {
    display: flex;
    gap: 0.5rem;
}

.mode-tab {
    flex: 1;
    padding: 0.65rem 0.5rem;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    /* CHANGED: 非アクティブタブの識別性向上 - クリック可能と分かるように */
    background-color: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
}

/* Questionnaire tab active */
.mode-tab.tab-questionnaire.active {
    background-color: var(--a-bg);
    color: var(--a-text);
    border-color: var(--a-border);
}

/* Notebook tab active */
.mode-tab.tab-notebook.active {
    background-color: var(--g-bg);
    color: var(--g-text);
    border-color: var(--g-border);
}

.mode-tab:not(.active):hover {
    background-color: #f0f0f0; /* CHANGED: ホバー時のみグレー背景 */
    color: #666;
}

/* === Mode Card === */
.mode-card {
    background-color: var(--g-bg);
    border: 1px solid var(--g-border);
    border-left: 3px solid var(--g-main);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 0.7rem 0.9rem;
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
}

.mode-card-dot {
    width: 8px;
    height: 8px;
    background-color: var(--g-main);
    border-radius: 50%;
    margin-top: 0.35rem;
    flex-shrink: 0;
}

.mode-card-body {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
}

.mode-card-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--g-text);
}

.mode-card-desc {
    font-size: 0.75rem;
    color: var(--g-desc);
    line-height: 1.5;
}

/* === AI Status Badge === */
.ai-status {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.4rem 0.75rem;
    border-radius: 20px;
    background-color: var(--settings-bg);
    border: 1px solid var(--border);
    width: fit-content;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-secondary);
    transition: var(--transition);
}

.ai-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--text-secondary);
    flex-shrink: 0;
    transition: background-color 0.3s ease;
}

/* Idle */
.ai-status.idle .ai-status-dot {
    background-color: #b0b0b0;
}

/* Processing */
.ai-status.processing {
    background-color: #EEF4FB;
    border-color: var(--c-info-border);
    color: var(--c-info-text);
}
.ai-status.processing .ai-status-dot {
    background-color: #3B82F6;
    animation: pulse-dot 1.2s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
}

/* Done */
.ai-status.done {
    background-color: var(--g-bg);
    border-color: var(--g-border);
    color: var(--g-text);
}
.ai-status.done .ai-status-dot {
    background-color: var(--g-main);
}

/* Error */
.ai-status.error {
    background-color: var(--c-error-bg);
    border-color: var(--c-error-border);
    color: var(--c-error-text);
}
.ai-status.error .ai-status-dot {
    background-color: var(--c-error-text);
}

/* === Upload === */
.upload-section {
    display: flex;
    flex-direction: column;
}

.drop-zone {
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

/* Amber style (questionnaire) */
.drop-zone-amber {
    border: 2px dashed var(--a-border);
    background-color: var(--a-bg);
}

.drop-zone-amber:hover,
.drop-zone-amber.dragover {
    border-color: var(--a-main);
    background-color: #fcecd0;
}

.drop-zone-amber .upload-icon {
    color: var(--a-main);
}

/* Green style (notebook) */
.drop-zone-green {
    border: 2px dashed var(--g-border);
    background-color: var(--g-bg);
}

.drop-zone-green:hover,
.drop-zone-green.dragover {
    border-color: var(--g-main);
    background-color: #d8f0df;
}

.drop-zone-green .upload-icon {
    color: var(--g-main);
}

.upload-icon {
    font-size: 2rem;
    margin-bottom: 0.4rem;
}

.drop-text {
    margin-bottom: 0.5rem;
    color: #5a5a5a; /* CHANGED: コントラスト改善 var(--text-secondary)→#5a5a5a */
    font-size: 0.82rem;
}

.preview-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: var(--surface);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
}

.preview-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.btn-remove {
    position: absolute;
    top: 8px; right: 8px;
    background-color: rgba(0,0,0,0.5);
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    font-size: 0.75rem;
    transition: var(--transition);
}

.btn-remove:hover {
    background-color: #d94040;
}

/* === Buttons === */
.btn {
    padding: 0.45rem 1rem;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
}

.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-upload {
    background-color: var(--surface);
    color: var(--a-text);
    border: 1px solid var(--a-border);
    font-weight: 600;
}

.btn-upload:hover {
    background-color: var(--a-bg);
}

/* Green variant for notebook mode */
.btn-upload-green {
    color: var(--g-text);
    border-color: var(--g-border);
}

.btn-upload-green:hover {
    background-color: var(--g-bg);
}

.btn-result {
    background-color: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 0.3rem 0.65rem;
    font-size: 0.75rem;
}

.btn-result:hover {
    border-color: var(--g-main);
    color: var(--g-text);
    background-color: var(--g-bg);
}

/* === Loading === */
.loading-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    z-index: 100;
    color: white;
}

.spinner {
    width: 38px; height: 38px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: var(--g-main);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* === Result === */
.result-section {
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    overflow: hidden;
}

.result-green {
    border: 1px solid var(--g-border);
}

.result-green .result-header {
    background-color: var(--g-bg);
    border-bottom: 1px solid var(--g-border);
}

.result-green .result-header h3 {
    color: var(--g-text);
}

.result-amber {
    border: 1px solid var(--a-border);
}

.result-amber .result-header {
    background-color: var(--a-bg);
    border-bottom: 1px solid var(--a-border);
}

.result-amber .result-header h3 {
    color: var(--a-text);
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0.85rem;
}

.result-header h3 {
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
}

.result-actions {
    display: flex;
    gap: 0.3rem;
}

.textarea-container {
    position: relative;
    flex-grow: 1;
    min-height: 200px;
}

textarea {
    width: 100%;
    height: 100%;
    min-height: 200px;
    padding: 0.9rem;
    border: none;
    resize: none;
    font-family: monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    background-color: var(--surface);
    color: var(--text-primary);
    outline: none;
}

/* === Status Panel === */
.status-panel {
    padding: 0.9rem;
    background-color: var(--surface);
}

.status-message {
    padding: 1rem;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.5rem;
}

.status-message i { font-size: 2.2rem; }

.status-message.success {
    background-color: var(--g-bg);
    color: var(--g-text);
    border: 1px solid var(--g-border);
}

.status-message.error {
    /* CHANGED: ハードコード色→セマンティックカラー変数 */
    background-color: var(--c-error-bg);
    color: var(--c-error-text);
    border: 1px solid var(--c-error-border);
}

.json-preview {
    margin-top: 0.4rem;
    width: 100%;
    background-color: rgba(0,0,0,0.03);
    padding: 0.7rem;
    border-radius: 6px;
    font-size: 0.72rem;
    text-align: left;
    overflow-x: auto;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-primary);
}

/* === Footer === */
.app-footer {
    padding: 0.7rem 1.25rem;
    border-top: 1px solid var(--border);
    text-align: center;
}

.app-footer p {
    font-size: 0.72rem;
    color: #6b6b6b; /* CHANGED: コントラスト改善 var(--text-secondary)→#6b6b6b */
}

/* === Toast === */
.toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(70px);
    background-color: #333;
    color: white;
    padding: 0.55rem 1.1rem;
    border-radius: 18px;
    font-size: 0.78rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 200;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

/* === Responsive === */
@media (max-width: 500px) {
    body { padding: 0; }
    .app-container {
        border-radius: 0;
        border: none;
        min-height: 100vh;
    }
}
</style>
