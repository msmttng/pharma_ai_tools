<script>
// === DOM ===
var toast = document.getElementById('toast');
var dropZone = document.getElementById('drop-zone');
var fileInput = document.getElementById('file-input');
var previewContainer = document.getElementById('preview-container');
var imagePreview = document.getElementById('image-preview');
var removeBtn = document.getElementById('remove-btn');
var loadingOverlay = document.getElementById('loading-overlay');
var loadingText = document.getElementById('loading-text');
var gasUrlInput = document.getElementById('gas-url-input');
var dropText = document.getElementById('drop-text');
var modeCardTitle = document.getElementById('mode-card-title');
var modeCardDesc = document.getElementById('mode-card-desc');
var btnUpload = document.getElementById('btn-upload');

// === State ===
var currentFile = null;
var base64Data = null;
var currentMode = 'questionnaire';

// === Mode Config ===
var modeConfig = {
    questionnaire: {
        title: '問診票モード',
        desc: '読み取り内容を抽出します',
        dropText: '問診票の画像をドロップ<br>または',
        loadingText: 'AIが問診票を解析・送信中...',
        dropClass: 'drop-zone-amber',
        btnClass: ''
    },
    notebook: {
        title: 'お薬手帳モード',
        desc: '画像から医薬品名のみを抽出します',
        dropText: 'お薬手帳の画像をドロップ<br>または',
        loadingText: 'AIがお薬手帳を解析中...',
        dropClass: 'drop-zone-green',
        btnClass: 'btn-upload-green'
    }
};

// === GAS URL ===
if (localStorage.getItem('gasUrl')) {
    gasUrlInput.value = localStorage.getItem('gasUrl');
}
gasUrlInput.addEventListener('change', function(e) {
    localStorage.setItem('gasUrl', e.target.value.trim());
});

// === Tab Switching ===
var tabs = document.querySelectorAll('.mode-tab');

function switchMode(mode) {
    currentMode = mode;
    var cfg = modeConfig[mode];

    // Tab active state
    tabs.forEach(function(t) { t.classList.remove('active'); });
    document.getElementById('tab-' + mode).classList.add('active');

    // Mode card
    modeCardTitle.textContent = cfg.title;
    modeCardDesc.textContent = cfg.desc;

    // Drop zone color
    dropZone.className = 'drop-zone ' + cfg.dropClass;
    dropText.innerHTML = cfg.dropText;

    // Upload button color
    btnUpload.className = 'btn btn-upload ' + cfg.btnClass;

    // Hide results
    document.getElementById('result-notebook').style.display = 'none';
    hideQuestionnaireResult();
}

tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
        switchMode(tab.getAttribute('data-mode'));
    });
});

// === Image Handling ===
dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
    }
});

fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
    }
});

removeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    clearImage();
});

var MAX_WIDTH = 1500;
var JPEG_QUALITY = 0.85;
var resizedMimeType = 'image/jpeg';

function resizeImage(dataUrl) {
    return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() {
            var w = img.width;
            var h = img.height;
            if (w > MAX_WIDTH) {
                h = Math.round(h * (MAX_WIDTH / w));
                w = MAX_WIDTH;
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var resizedDataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
            resolve(resizedDataUrl);
        };
        img.src = dataUrl;
    });
}

function handleFile(file) {
    if (!file.type.match('image.*')) {
        showToast('画像ファイル(JPEG/PNG)を選択してください');
        return;
    }
    currentFile = file;

    var reader = new FileReader();
    reader.onload = function(e) {
        var originalDataUrl = e.target.result;
        resizeImage(originalDataUrl).then(function(resizedDataUrl) {
            imagePreview.src = resizedDataUrl;
            previewContainer.style.display = 'flex';
            base64Data = resizedDataUrl.split(',')[1];
            resizedMimeType = 'image/jpeg';
            autoAnalyze();
        });
    };
    reader.readAsDataURL(file);
}

function clearImage() {
    currentFile = null;
    base64Data = null;
    fileInput.value = '';
    previewContainer.style.display = 'none';
    imagePreview.src = '';
}

function getBase64() { return base64Data; }
function getMimeType() { return resizedMimeType; }

// === Auto Analyze ===
function autoAnalyze() {
    if (currentMode === 'notebook') {
        analyzeNotebook();
    } else {
        analyzeQuestionnaire();
    }
}

// === Notebook ===
var resultNotebook = document.getElementById('result-notebook');
var resultTextNotebook = document.getElementById('result-text-notebook');
var copyBtnNotebook = document.getElementById('copy-btn-notebook');
var clearBtnNotebook = document.getElementById('clear-btn-notebook');

async function analyzeNotebook() {
    if (!getBase64()) return;

    loadingText.textContent = modeConfig.notebook.loadingText;
    loadingOverlay.style.display = 'flex';
    resultNotebook.style.display = 'none';
    hideQuestionnaireResult();

    try {
        var gasUrl = gasUrlInput.value.trim() || localStorage.getItem('gasUrl');
        var extractedText = '';

        if (gasUrl) {
            var payload = { type: 'notebook', image: getBase64(), mimeType: getMimeType() };
            var response = await fetch(gasUrl, { method: 'POST', body: JSON.stringify(payload) });
            if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
            var result = await response.json();
            if (result.status === 'success' && result.data) {
                extractedText = result.data;
            } else {
                throw new Error(result.message || 'Unknown API Error');
            }
        } else {
            extractedText = "ロキソプロフェンナトリウム錠60mg「EMEC」\nレバミピド錠100mg「オーハラ」\nセフジニルカプセル100mg「サワイ」";
        }

        resultTextNotebook.value = extractedText;
        resultNotebook.style.display = 'flex';
    } catch (error) {
        resultTextNotebook.value = 'エラーが発生しました。\n詳細: ' + error.message;
        resultNotebook.style.display = 'flex';
    } finally {
        loadingOverlay.style.display = 'none';
    }
}

copyBtnNotebook.addEventListener('click', function() {
    if (resultTextNotebook.value) {
        navigator.clipboard.writeText(resultTextNotebook.value)
            .then(function() { showToast('クリップボードにコピーしました'); })
            .catch(function() { showToast('コピーに失敗しました'); });
    }
});

clearBtnNotebook.addEventListener('click', function() {
    resultTextNotebook.value = '';
    resultNotebook.style.display = 'none';
    clearImage();
});

// === Questionnaire ===
var resultQuestionnaire = document.getElementById('result-questionnaire');
var lastQuestionnaireData = null;

function hideQuestionnaireResult() {
    resultQuestionnaire.style.display = 'none';
    document.getElementById('success-message-questionnaire').style.display = 'none';
    document.getElementById('error-message-questionnaire').style.display = 'none';
}

function formatQuestionnaireForClipboard(d) {
    var rawCondition = d['患者状態'] || 'なし';
    var isNo = (rawCondition === 'なし' || rawCondition === '該当なし');
    var cond = isNo ? 'なし' : rawCondition;

    var booklet = d['お薬手帳'] || 'なし';
    if (booklet === 'あり') {
        var bt = d['手帳タイプ'];
        if (bt && bt !== 'なし') booklet = 'あり(' + bt + ')';
    }

    var hist = d['既往歴'] || 'なし';
    var hd = d['既往歴詳細'];
    if (hd && hd !== 'なし' && hd !== '') hist += ', ' + hd;

    var env = d['環境アレルギー'] || 'なし';

    var da = d['薬アレルギー'] || 'なし';
    var dad = d['薬アレルギー詳細'];
    var daDisp = '薬・副作用等:' + da;
    if (da === 'あり' && dad && dad !== 'なし' && dad !== '') daDisp = '薬・副作用等:' + dad;

    var fa = d['食品アレルギー'] || 'なし';
    var fad = d['食品アレルギー詳細'];
    var faDisp = fa;
    if (fa === 'あり' && fad && fad !== 'なし' && fad !== '') faDisp = 'あり (' + fad + ')';

    var cp = d['他院処方'] || 'なし';
    var cpd = d['他院処方詳細'];
    var cpPart = '他院処方:' + cp;
    if (cp === 'あり' && cpd && cpd !== 'なし' && cpd !== '') cpPart = '他院処方:' + cpd;

    var otc = d['市販薬・サプリメント'] || 'なし';
    var otcd = d['市販薬詳細'];
    var otcPart = '市販薬･サプリ:' + otc;
    if (otc !== 'なし' && otcd && otcd !== 'なし' && otcd !== '') otcPart = '市販薬･サプリ:' + otc + ' (' + otcd + ')';

    var alc = d['飲酒'] || 'なし';
    var fd = d['飲食物'] || 'なし';
    var fdd = d['飲食物詳細'];
    var fdPart = fd;
    if (fdd && fdd !== 'なし' && fdd !== '') fdPart += ', ' + fdd;

    var dr = d['運転'] || 'なし';
    var hw = d['高所作業'] || 'なし';
    var sm = d['喫煙'] || 'なし';

    return [
        '【初回問診引用】',
        '■電話番号: ' + (d['電話番号'] || 'なし'),
        '■患者様の状態: ' + cond,
        '■後発品変更希望: ' + (d['ジェネリック希望'] || 'なし'),
        '■手帳活用の有無: ' + booklet,
        '■既往歴: ' + hist,
        '■花粉症・アレルゲンについて: ' + env,
        '■副作用歴、薬物アレルギー: ' + daDisp,
        '■食物等アレルギー: ' + faDisp,
        '■定期的服用薬・サプリメント・OTC: ' + cpPart + ' / ' + otcPart,
        '■飲食物の摂取状況等: 酒:' + alc + ' / 飲食物:' + fdPart,
        '■薬学的管理に必要な患者の生活像: 妊娠・授乳・小児:' + cond + ' / 運転:' + dr + ' / 高所作業:' + hw + ' / コンタクト:なし / 喫煙:' + sm
    ].join('\n');
}

async function analyzeQuestionnaire() {
    if (!getBase64()) return;

    var gasUrl = gasUrlInput.value.trim();
    if (!gasUrl) {
        showToast('GASのWebアプリURLを入力してください');
        gasUrlInput.focus();
        return;
    }

    loadingText.textContent = modeConfig.questionnaire.loadingText;
    loadingOverlay.style.display = 'flex';
    resultNotebook.style.display = 'none';
    hideQuestionnaireResult();

    try {
        var payload = { type: 'questionnaire', image: getBase64(), mimeType: getMimeType() };
        var response = await fetch(gasUrl, { method: 'POST', body: JSON.stringify(payload) });
        if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
        var result = await response.json();

        if (result.status === 'success') {
            lastQuestionnaireData = result.data;
            resultQuestionnaire.style.display = 'flex';
            document.getElementById('success-message-questionnaire').style.display = 'flex';
            if (result.data) {
                document.getElementById('json-preview-questionnaire').textContent = formatQuestionnaireForClipboard(result.data);
            }
        } else {
            throw new Error(result.message || 'スプレッドシートへの保存に失敗しました。');
        }
    } catch (error) {
        resultQuestionnaire.style.display = 'flex';
        document.getElementById('error-message-questionnaire').style.display = 'flex';
        document.getElementById('error-text-questionnaire').textContent = error.message;
    } finally {
        loadingOverlay.style.display = 'none';
    }
}

var copyBtnQ = document.getElementById('copy-btn-questionnaire');
var clearBtnQ = document.getElementById('clear-btn-questionnaire');

copyBtnQ.addEventListener('click', function() {
    var preview = document.getElementById('json-preview-questionnaire');
    if (preview.textContent) {
        navigator.clipboard.writeText(preview.textContent)
            .then(function() { showToast('初回問診引用をクリップボードにコピーしました'); })
            .catch(function() { showToast('コピーに失敗しました'); });
    }
});

clearBtnQ.addEventListener('click', function() {
    lastQuestionnaireData = null;
    hideQuestionnaireResult();
    clearImage();
});

// === Utils ===
function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
}
</script>
