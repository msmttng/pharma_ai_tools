<script>
// === DOM Elements ===
const toast = document.getElementById('toast');
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const previewContainer = document.getElementById('preview-container');
const imagePreview = document.getElementById('image-preview');
const removeBtn = document.getElementById('remove-btn');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const gasUrlInput = document.getElementById('gas-url-input');
const dropText = document.getElementById('drop-text');
const modeDescriptionText = document.getElementById('mode-description-text');

// === State ===
let currentFile = null;
let base64Data = null;
let currentMode = 'questionnaire'; // default

// === Mode Descriptions ===
const modeDescriptions = {
    questionnaire: '読み取り内容を自動送信します。妊娠・授乳・小児などの項目は自動でスキップ処理されます。',
    notebook: '画像から医薬品名を抽出し、GASへ自動送信します。'
};

const modeDropTexts = {
    questionnaire: '問診票の画像をドロップ<br>または',
    notebook: 'お薬手帳の画像をドロップ<br>または'
};

const modeLoadingTexts = {
    questionnaire: 'AIが問診票を解析・送信中...',
    notebook: 'AIがお薬手帳を解析中...'
};

// === GAS URL persistence ===
if (localStorage.getItem('gasUrl')) {
    gasUrlInput.value = localStorage.getItem('gasUrl');
}
gasUrlInput.addEventListener('change', function(e) {
    localStorage.setItem('gasUrl', e.target.value.trim());
});

// === Tab Switching ===
var tabs = document.querySelectorAll('.mode-tab');
tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentMode = tab.getAttribute('data-mode');
        modeDescriptionText.textContent = modeDescriptions[currentMode];
        dropText.innerHTML = modeDropTexts[currentMode];
        // Hide previous results
        document.getElementById('result-notebook').style.display = 'none';
        hideQuestionnaireResult();
    });
});

// === Image Handling ===
dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
    }
});

fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
    }
});

removeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    clearImage();
});

function handleFile(file) {
    if (!file.type.match('image.*')) {
        showToast('画像ファイル(JPEG/PNG)を選択してください');
        return;
    }
    currentFile = file;

    var reader = new FileReader();
    reader.onload = function(e) {
        imagePreview.src = e.target.result;
        previewContainer.style.display = 'flex';
        base64Data = e.target.result.split(',')[1];
        // 自動解析開始
        autoAnalyze();
    };
    reader.readAsDataURL(file);
}

function clearImage() {
    currentFile = null;
    base64Data = null;
    fileInput.value = '';
    previewContainer.style.display = 'none';
    imagePreview.src = '';
}

function getBase64() { return base64Data; }
function getMimeType() { return currentFile ? currentFile.type : null; }

// === Auto Analyze (upload triggers analysis) ===
function autoAnalyze() {
    if (currentMode === 'notebook') {
        analyzeNotebook();
    } else {
        analyzeQuestionnaire();
    }
}

// === Notebook Analysis ===
var resultNotebook = document.getElementById('result-notebook');
var resultTextNotebook = document.getElementById('result-text-notebook');
var copyBtnNotebook = document.getElementById('copy-btn-notebook');
var clearBtnNotebook = document.getElementById('clear-btn-notebook');

async function analyzeNotebook() {
    if (!getBase64()) return;

    loadingText.textContent = modeLoadingTexts.notebook;
    loadingOverlay.style.display = 'flex';
    resultNotebook.style.display = 'none';
    hideQuestionnaireResult();

    try {
        var gasUrl = gasUrlInput.value.trim() || localStorage.getItem('gasUrl');
        var extractedText = '';

        if (gasUrl) {
            var payload = {
                type: 'notebook',
                image: getBase64(),
                mimeType: getMimeType()
            };

            var response = await fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
            var result = await response.json();

            if (result.status === 'success' && result.data) {
                extractedText = result.data;
            } else {
                throw new Error(result.message || 'Unknown API Error');
            }
        } else {
            extractedText = "ロキソプロフェンナトリウム錠60mg「EMEC」\nレバミピド錠100mg「オーハラ」\nセフジニルカプセル100mg「サワイ」";
            console.warn('GAS URL not set, using mock data.');
        }

        resultTextNotebook.value = extractedText;
        resultNotebook.style.display = 'flex';

    } catch (error) {
        console.error('Error analyzing notebook:', error);
        resultTextNotebook.value = 'エラーが発生しました。\n詳細: ' + error.message + '\n\n※GASバックエンドのURLが正しく設定されているか確認してください。';
        resultNotebook.style.display = 'flex';
    } finally {
        loadingOverlay.style.display = 'none';
    }
}

copyBtnNotebook.addEventListener('click', function() {
    if (resultTextNotebook.value) {
        navigator.clipboard.writeText(resultTextNotebook.value)
            .then(function() { showToast('クリップボードにコピーしました'); })
            .catch(function(err) {
                console.error('Copy failed:', err);
                showToast('コピーに失敗しました');
            });
    }
});

clearBtnNotebook.addEventListener('click', function() {
    resultTextNotebook.value = '';
    resultNotebook.style.display = 'none';
    clearImage();
});


// === Questionnaire Analysis ===
var resultQuestionnaire = document.getElementById('result-questionnaire');
var lastQuestionnaireData = null;

function hideQuestionnaireResult() {
    resultQuestionnaire.style.display = 'none';
    document.getElementById('success-message-questionnaire').style.display = 'none';
    document.getElementById('error-message-questionnaire').style.display = 'none';
}

function formatQuestionnaireForClipboard(d) {
    var rawCondition = d['患者状態'] || 'なし';
    var isNoCondition = (rawCondition === 'なし' || rawCondition === '該当なし');
    var conditionDisplay = isNoCondition ? 'なし' : rawCondition;

    var bookletDisplay = d['お薬手帳'] || 'なし';
    if (bookletDisplay === 'あり') {
        var bookletType = d['手帳タイプ'];
        if (bookletType && bookletType !== 'なし') {
            bookletDisplay = 'あり(' + bookletType + ')';
        }
    }

    var historyDisplay = d['既往歴'] || 'なし';
    var historyDetail = d['既往歴詳細'];
    if (historyDetail && historyDetail !== 'なし' && historyDetail !== '') {
        historyDisplay += ', ' + historyDetail;
    }

    var envAllergyDisplay = d['環境アレルギー'] || 'なし';

    var drugAllergy = d['薬アレルギー'] || 'なし';
    var drugAllergyDetail = d['薬アレルギー詳細'];
    var drugAllergyDisplay = '薬・副作用等:' + drugAllergy;
    if (drugAllergy === 'あり' && drugAllergyDetail && drugAllergyDetail !== 'なし' && drugAllergyDetail !== '') {
        drugAllergyDisplay = '薬・副作用等:' + drugAllergyDetail;
    }

    var foodAllergy = d['食品アレルギー'] || 'なし';
    var foodAllergyDetail = d['食品アレルギー詳細'];
    var foodAllergyDisplay = foodAllergy;
    if (foodAllergy === 'あり' && foodAllergyDetail && foodAllergyDetail !== 'なし' && foodAllergyDetail !== '') {
        foodAllergyDisplay = 'あり (' + foodAllergyDetail + ')';
    }

    var currentPresc = d['他院処方'] || 'なし';
    var currentPrescDetail = d['他院処方詳細'];
    var prescPart = '他院処方:' + currentPresc;
    if (currentPresc === 'あり' && currentPrescDetail && currentPrescDetail !== 'なし' && currentPrescDetail !== '') {
        prescPart = '他院処方:' + currentPrescDetail;
    }

    var otcList = d['市販薬・サプリメント'] || 'なし';
    var otcDetail = d['市販薬詳細'];
    var otcPart = '市販薬･サプリ:' + otcList;
    if (otcList !== 'なし' && otcDetail && otcDetail !== 'なし' && otcDetail !== '') {
        otcPart = '市販薬･サプリ:' + otcList + ' (' + otcDetail + ')';
    }

    var alcohol = d['飲酒'] || 'なし';
    var foodDrink = d['飲食物'] || 'なし';
    var foodDrinkDetail = d['飲食物詳細'];
    var foodDrinkPart = foodDrink;
    if (foodDrinkDetail && foodDrinkDetail !== 'なし' && foodDrinkDetail !== '') {
        foodDrinkPart += ', ' + foodDrinkDetail;
    }

    var driving = d['運転'] || 'なし';
    var heightWork = d['高所作業'] || 'なし';
    var smoking = d['喫煙'] || 'なし';

    var lines = [
        '【初回問診引用】',
        '■電話番号: ' + (d['電話番号'] || 'なし'),
        '■患者様の状態: ' + conditionDisplay,
        '■後発品変更希望: ' + (d['ジェネリック希望'] || 'なし'),
        '■手帳活用の有無: ' + bookletDisplay,
        '■既往歴: ' + historyDisplay,
        '■花粉症・アレルゲンについて: ' + envAllergyDisplay,
        '■副作用歴、薬物アレルギー: ' + drugAllergyDisplay,
        '■食物等アレルギー: ' + foodAllergyDisplay,
        '■定期的服用薬・サプリメント・OTC: ' + prescPart + ' / ' + otcPart,
        '■飲食物の摂取状況等: 酒:' + alcohol + ' / 飲食物:' + foodDrinkPart,
        '■薬学的管理に必要な患者の生活像: 妊娠・授乳・小児:' + conditionDisplay + ' / 運転:' + driving + ' / 高所作業:' + heightWork + ' / コンタクト:なし / 喫煙:' + smoking
    ];

    return lines.join('\n');
}

async function analyzeQuestionnaire() {
    if (!getBase64()) return;

    var gasUrl = gasUrlInput.value.trim();
    if (!gasUrl) {
        showToast('GASのWebアプリURLを入力してください');
        gasUrlInput.focus();
        return;
    }

    loadingText.textContent = modeLoadingTexts.questionnaire;
    loadingOverlay.style.display = 'flex';
    resultNotebook.style.display = 'none';
    hideQuestionnaireResult();

    try {
        var payload = {
            type: 'questionnaire',
            image: getBase64(),
            mimeType: getMimeType()
        };

        var response = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
        var result = await response.json();

        if (result.status === 'success') {
            lastQuestionnaireData = result.data;
            resultQuestionnaire.style.display = 'flex';
            var successMsg = document.getElementById('success-message-questionnaire');
            successMsg.style.display = 'flex';
            if (result.data) {
                var formattedText = formatQuestionnaireForClipboard(result.data);
                document.getElementById('json-preview-questionnaire').textContent = formattedText;
            }
        } else {
            throw new Error(result.message || 'スプレッドシートへの保存に失敗しました。');
        }

    } catch (error) {
        console.error('Error processing questionnaire:', error);
        resultQuestionnaire.style.display = 'flex';
        var errorMsg = document.getElementById('error-message-questionnaire');
        errorMsg.style.display = 'flex';
        document.getElementById('error-text-questionnaire').textContent = error.message;
    } finally {
        loadingOverlay.style.display = 'none';
    }
}

// Questionnaire Copy
var copyBtnQuestionnaire = document.getElementById('copy-btn-questionnaire');
var clearBtnQuestionnaire = document.getElementById('clear-btn-questionnaire');

copyBtnQuestionnaire.addEventListener('click', function() {
    var preview = document.getElementById('json-preview-questionnaire');
    if (preview.textContent) {
        navigator.clipboard.writeText(preview.textContent)
            .then(function() { showToast('初回問診引用をクリップボードにコピーしました'); })
            .catch(function(err) {
                console.error('Copy failed:', err);
                showToast('コピーに失敗しました');
            });
    }
});

clearBtnQuestionnaire.addEventListener('click', function() {
    lastQuestionnaireData = null;
    hideQuestionnaireResult();
    clearImage();
});

// === Utils ===
function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(function() {
        toast.classList.remove('show');
    }, 3000);
}
</script>
